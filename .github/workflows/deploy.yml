name: Rollback auf alte React-App (nur manuell)

# Seit dem Umzug (10/2026) deployt das Repo Levoram/nico-kuechler-web die ganze
# Domain per GitHub Actions. Dieser Workflow läuft deshalb NICHT mehr bei Push —
# sonst würde mirror --delete die neue Seite überschreiben.
# Manuell starten (Actions → Run workflow) = Rollback auf diese React-App.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Deploy via SFTP to IONOS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          # lftp reads the password from LFTP_PASSWORD via --env-password
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          # events/ wird vom separaten Repo nico-kuechler-web deployt — nicht anfassen/löschen
          mirror -R --delete --exclude-glob events/ --verbose dist/ $FTP_SERVER_DIR
          quit
          EOF
